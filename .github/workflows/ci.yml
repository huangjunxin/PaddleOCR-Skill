name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: python3 -m py_compile paddleocr-vl-remote/scripts/*.py
      - name: CLI smoke test
        run: |
          python3 paddleocr-vl-remote/scripts/ocr.py --help >/dev/null
          python3 paddleocr-vl-remote/scripts/check_server.py --help >/dev/null
